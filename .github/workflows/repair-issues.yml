name: "자동 이슈 수리"

# 2026-09-29 추가: 대시보드(admin.html 자동화 현황)가 잡아내는 이슈 중
# "사실관계로 확인 가능한 것"(날짜 공백·건수 부족·관리종목 등 규정 위반·빈
# 분석 재시도)을 정규 수집 뒤 자동으로 고치고 repair_log에 기록한다
# (scripts/repair_issues.py 참고). 판단이 필요한 건 고치지 않고 이 워크플로를
# 실패로 남겨 report-gap-check.yml과 같은 방식으로 저장소 소유자에게 GitHub
# 기본 이메일 알림이 가게 한다.
#
# gainers-daily.yml(07:00 UTC)보다 늦게, report-gap-check.yml(09:00 UTC)보다는
# 먼저 돌려서 - 정규 수집이 뭔가 놓쳤어도 그 알림이 뜨기 전에 스스로 채울
# 기회를 준다.

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 groq google-generativeai

      - name: 이슈 감지·자동 수리
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/repair_issues.py
