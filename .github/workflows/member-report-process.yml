name: "회원 종목 리포트 요청 처리 (수동 실행 · 기본은 점검만)"

# 2026-10-29 (P4): 사이트 My page에서 접수된 리포트 요청(member_report_requests)을 처리하는 워크플로.
#
# 안전 장치 (모두 갖춰야 실제 메일이 나간다):
#   1) 이 워크플로를 "send = true"로 직접 실행해야 한다. 기본값(false)은 점검 모드 - 대기 요청 개수만 읽어 보여주고
#      DB 수정·메일 발송을 하지 않는다.
#   2) 저장소 변수(Settings → Secrets and variables → Actions → Variables)에 MEMBER_REPORT_SEND_APPROVED = yes 를
#      회장님이 직접 등록해야 한다. (이 저장소 규칙 CLAUDE.md 8번: 외부 발송은 직전 명시적 승인 필요)
#   3) 발송 수단 비밀값이 등록돼 있어야 한다: GMAIL_ADDRESS + GMAIL_APP_PASSWORD (Gmail 앱 비밀번호, 2026-10-31 회장님 선택)
#      또는 RESEND_API_KEY + MAIL_FROM. 둘 다 있으면 Gmail을 쓴다.
#   하나라도 없으면 스크립트가 "발송 안 함"을 출력하고 종료 코드 2로 멈춘다(요청 상태도 건드리지 않음).
#
# 스케줄(자동 실행)은 일부러 넣지 않았다. 자동 처리(요청 접수 직후 깨우기 + 안전망 주기 실행)는 첫 실발송 시험이
# 끝난 뒤 별도로 연결한다.
#
# 필요한 Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (모든 모드), GROQ_API_KEY(AI 설명),
#                 GMAIL_ADDRESS, GMAIL_APP_PASSWORD (또는 RESEND_API_KEY, MAIL_FROM),
#                 ADMIN_ALERT_EMAIL(한도 초과 알림을 받을 회장님 주소)
# 설계서: manzo-site 저장소 docs/superpowers/specs/2026-10-25-member-report-addendum.md

on:
  workflow_dispatch:
    inputs:
      send:
        description: "true = 실제로 처리·발송(승인 변수 필요), false = 점검만"
        type: boolean
        default: false

concurrency:
  group: member-report-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 이 저장소(리서치자동화) 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install requests beautifulsoup4 groq

      - name: 단위 테스트 (금지 표현·승인 장치·알림 규칙 등)
        run: |
          python -m unittest tests.test_member_report tests.test_member_report_mail -v

      - name: 요청 처리 (기본은 점검만)
        env:
          SEND: ${{ inputs.send }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          MEMBER_REPORT_SEND_APPROVED: ${{ vars.MEMBER_REPORT_SEND_APPROVED }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$SEND" = "true" ]; then
            python -u scripts/member_report_process.py --send
          else
            python -u scripts/member_report_process.py
          fi
