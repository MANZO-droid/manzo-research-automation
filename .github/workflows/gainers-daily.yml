name: "상승률 상위 10위 자동 수집"

# 2026-08-01: 이 워크플로는 원래 manzo-site 저장소(사이트 코드) 안에 있었는데,
# 리서치자동화가 별도 저장소로 분리되면서 여기로 옮겨왔습니다.
#
# 2026-08-01(2차): 결과를 사이트 저장소의 stock-analysis-data.json에 git push하던
# 방식을 버리고 Supabase(daily_gainers, volume_stocks 테이블)에 직접 저장하도록
# 바꿨습니다. 그래서 이제 사이트 저장소를 체크아웃/커밋/푸시할 필요가 없습니다 -
# 사이트는 /api/top-gainers가 Supabase를 읽어 실시간으로 보여줍니다.
#
# scripts/collect_gainers.py를 인자 없이 실행하면 내부적으로
# scripts/krx_calendar.py(get_weekly_report_trigger)가 오늘이 KRX 개장일인지,
# 그리고 daily/weekly 중 어떤 모드로 발행해야 하는지를 자동으로 판단합니다
# (평일 개장일=daily, 토요일 또는 금요일 휴장/연휴 시작일=weekly, 그 외=skip).
# 그래서 이 워크플로우는 요일 조건 없이 "평일~토요일"에 매일 호출하고,
# 실제 실행 여부/모드 판단은 스크립트에게 맡깁니다.
#
# 필요한 GitHub Secrets (이 저장소의 Settings → Secrets and variables → Actions):
#   - GROQ_API_KEY               : Groq API 키, 무료(console.groq.com에서 발급, 사람이 직접 등록해야 함)
#                                   2026-08-01부로 무료 티어 유지를 위해 Anthropic Claude에서 교체됨
#   - SUPABASE_URL                : 사이트가 쓰는 것과 동일한 Supabase 프로젝트 URL
#   - SUPABASE_SERVICE_ROLE_KEY   : RLS를 우회해 쓰기 위한 서버 전용 키 (사이트 저장소 .env.local과 동일 값)
#
# (더 이상 필요하지 않음: SITE_REPO_PAT — 사이트 저장소에 커밋할 필요가 없어져서 제거했습니다.)

on:
  schedule:
    # 매일 07:00 UTC = 16:00 KST, 월~토(cron 요일: 0=일 ... 6=토 → 1-6 = 월~토)
    # 일요일은 KRX가 항상 휴장이므로 제외.
    - cron: "0 7 * * 1-6"
  workflow_dispatch: {}

concurrency:
  group: gainers-daily
  cancel-in-progress: false

jobs:
  collect-gainers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 이 저장소(리서치자동화) 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install requests beautifulsoup4 groq

      - name: 상승률 상위 10위 수집 (거래일 캘린더 자동 판단) → Supabase 저장
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/collect_gainers.py
