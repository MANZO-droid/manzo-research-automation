name: "상승률 상위 10위 자동 수집"

# 2026-08-01: 이 워크플로는 원래 manzo-site 저장소(사이트 코드) 안에 있었는데,
# 리서치자동화가 별도 저장소로 분리되면서 여기로 옮겨왔습니다. 결과 JSON은
# 이 저장소가 아니라 사이트 저장소(manzo-site)에 있어서, 그쪽 저장소를
# site-repo/ 아래에 추가로 체크아웃하고 SITE_REPO_PATH로 위치를 알려줍니다.
#
# scripts/collect_gainers.py를 인자 없이 실행하면 내부적으로
# scripts/krx_calendar.py(get_weekly_report_trigger)가 오늘이 KRX 개장일인지,
# 그리고 daily/weekly 중 어떤 모드로 발행해야 하는지를 자동으로 판단합니다
# (평일 개장일=daily, 토요일 또는 금요일 휴장/연휴 시작일=weekly, 그 외=skip).
# 그래서 이 워크플로우는 요일 조건 없이 "평일~토요일"에 매일 호출하고,
# 실제 실행 여부/모드 판단은 스크립트에게 맡깁니다.
#
# 필요한 GitHub Secrets (이 저장소의 Settings → Secrets and variables → Actions):
#   - GROQ_API_KEY  : Groq API 키, 무료(console.groq.com에서 발급, 사람이 직접 등록해야 함)
#                     2026-08-01부로 무료 티어 유지를 위해 Anthropic Claude에서 교체됨
#   - SITE_REPO_PAT : manzo-site 저장소에 쓰기 권한이 있는 Personal Access Token
#                     (이 워크플로가 결과 JSON을 그 저장소에 커밋·푸시하기 위해 필요)

on:
  schedule:
    # 매일 07:00 UTC = 16:00 KST, 월~토(cron 요일: 0=일 ... 6=토 → 1-6 = 월~토)
    # 일요일은 KRX가 항상 휴장이므로 제외.
    - cron: "0 7 * * 1-6"
  workflow_dispatch: {}

concurrency:
  group: gainers-daily
  cancel-in-progress: false

jobs:
  collect-gainers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 이 저장소(리서치자동화) 체크아웃
        uses: actions/checkout@v4

      - name: 사이트 저장소(manzo-site) 체크아웃 (결과를 여기에 씀)
        uses: actions/checkout@v4
        with:
          repository: MANZO-droid/manzo-site
          token: ${{ secrets.SITE_REPO_PAT }}
          path: site-repo
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install requests beautifulsoup4 groq

      - name: 상승률 상위 10위 수집 (거래일 캘린더 자동 판단)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_REPO_PATH: ${{ github.workspace }}/site-repo
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/collect_gainers.py

      - name: 사이트 저장소에 변경사항 커밋 및 푸시 (안전망)
        # 참고: scripts/collect_gainers.py 내부의 git_push()가 이미
        # site-repo/에서 commit+push를 시도합니다. 이 스텝은 그 내부 push가
        # 어떤 이유로든 실패했을 때를 위한 안전망이며, 이미 반영된 경우
        # (diff 없음)는 조용히 스킵됩니다.
        working-directory: site-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock-analysis-data.json
          git diff --cached --quiet || git commit -m "data: 상승률 상위 10위 자동 업데이트 ($(date -u +%Y-%m-%d))"
          git push
