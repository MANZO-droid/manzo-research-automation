name: "과거 데이터 KRX 백필 (수동)"

# 2026-08-01: KRX Open API(회장님이 발급·연동해둔 KRX_OPENAPI_KEY)로 네이버
# 실시간 페이지로는 불가능한 과거 날짜 백필을 처리한다. scripts/backfill_krx_historical.py
# 참고(AUTOMATION_NOTES.md §8-7). workflow_dispatch로만 수동 실행 - 정기 크론 없음.
#
# 2026-08-03 추가: fix_dates(관리종목 등 잘못 포함된 종목 교정)와
# patch_mode(financials/news/analysis 재패치)도 이 워크플로에서 실행 가능.
# provider로 gemini/groq 중 선택(한쪽 할당량이 소진되면 다른 쪽으로 전환).
#
# 2026-08-09 추가, 2026-08-12 제거: 매일 한국시간 오후 4시 예약 실행으로
# patch_trend_technicals.py의 추세 기준 소급 반영(179행)을 자동으로
# 이어서 처리하게 했었다(trendCriteriaVersion 마커로 멱등적 재실행).
# 3일간(8/9~8/12) 자동으로 돌면서 286/290행 완료, 남은 4행(신진에스엠·
# 빅텐츠·비엔에스웍스·씨에스윈드)은 상장폐지 추정으로 재조회 자체가
# 불가능해 더 이상 진행되지 않는 상태 확인 → 목적 달성으로 스케줄 제거.
# patch_mode=trend는 workflow_dispatch로 여전히 수동 실행 가능.
#
# 2026-08-12 추가: 언어 오염(태국어/베트남어/중국어 한자 혼입, 205행)
# 소급 재생성을 같은 방식(languageCleanVersion 마커 + --minutes 시간
# 예산)으로 매일 UTC 07:00(한국시간 16시, Gemini 할당량 리셋 직후) 자동
# 재시도. 다 끝나면(전부 마커됨) 조회만 하고 아무 것도 안 해 무해함 -
# 회장님이 확인 후 이 schedule 블록을 지워도 됨.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dates:
        description: "쉼표로 구분된 날짜 목록 (예: 2026-07-20,2026-07-21)"
        required: false
      date_from:
        description: "시작 날짜 (YYYY-MM-DD) - dates 대신 범위로 지정할 때"
        required: false
      date_to:
        description: "종료 날짜 (YYYY-MM-DD)"
        required: false
      weekly_date:
        description: "주간 리포트를 다시 계산할 발행일(YYYY-MM-DD) - 이걸 채우면 위 항목은 무시됨"
        required: false
      week_start:
        description: "주간 재계산 시 시작일"
        required: false
      week_end:
        description: "주간 재계산 시 종료일"
        required: false
      fix_dates:
        description: "관리종목 등 잘못 포함된 종목을 교정할 날짜 목록(쉼표 구분) - 이걸 채우면 위 항목 전부 무시됨"
        required: false
      patch_mode:
        description: "financials|news|analysis|both|language|trend|langfix - 이걸 채우면 위 항목 전부 무시됨(fix_dates보다 우선순위 낮음). language는 fix_language_issues.py, trend는 patch_trend_technicals.py(dates 입력 필요), langfix는 patch_language_contamination.py 실행"
        required: false
      provider:
        description: "gemini 또는 groq (fix_dates/patch_mode=analysis에서 사용)"
        required: false
        default: gemini

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 google-generativeai groq

      - name: 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -u scripts/patch_language_contamination.py --provider groq --minutes 45
          elif [ -n "${{ inputs.fix_dates }}" ]; then
            python -u scripts/fix_excluded_gainers.py --dates "${{ inputs.fix_dates }}" --provider "${{ inputs.provider }}"
          elif [ "${{ inputs.patch_mode }}" = "language" ]; then
            python -u scripts/fix_language_issues.py --provider "${{ inputs.provider }}"
          elif [ "${{ inputs.patch_mode }}" = "trend" ]; then
            python -u scripts/patch_trend_technicals.py --dates "${{ inputs.dates }}" --provider "${{ inputs.provider }}"
          elif [ "${{ inputs.patch_mode }}" = "langfix" ]; then
            python -u scripts/patch_language_contamination.py --provider "${{ inputs.provider }}" --minutes 55
          elif [ "${{ inputs.patch_mode }}" = "groqmodels" ]; then
            python -u scripts/list_groq_models.py
          elif [ -n "${{ inputs.patch_mode }}" ]; then
            python -u scripts/patch_gainer_fields.py --mode "${{ inputs.patch_mode }}" --provider "${{ inputs.provider }}"
          else
            ARGS=""
            if [ -n "${{ inputs.weekly_date }}" ]; then
              ARGS="--recompute-weekly ${{ inputs.weekly_date }} --week-start ${{ inputs.week_start }} --week-end ${{ inputs.week_end }}"
            elif [ -n "${{ inputs.dates }}" ]; then
              ARGS="--dates ${{ inputs.dates }}"
            elif [ -n "${{ inputs.date_from }}" ]; then
              ARGS="--from ${{ inputs.date_from }} --to ${{ inputs.date_to }}"
            else
              echo "입력값이 없습니다. dates/date_from/date_to/weekly_date/fix_dates/patch_mode 중 하나를 지정하세요."
              exit 1
            fi
            python -u scripts/backfill_krx_historical.py $ARGS
          fi
