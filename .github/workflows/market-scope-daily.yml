name: "마켓 스코프 자동 업데이트"

# 2026-08-01: 이 워크플로는 원래 manzo-site 저장소(사이트 코드) 안에 있었는데,
# 리서치자동화가 별도 저장소로 분리되면서 여기로 옮겨왔습니다.
#
# 2026-08-01(2차): 결과를 사이트 저장소의 market-scope-data.json에 git push하던
# 방식을 버리고 Supabase(market_scope_reports 테이블)에 직접 저장하도록
# 바꿨습니다. 그래서 이제 사이트 저장소를 체크아웃/커밋/푸시할 필요가 없습니다 -
# 사이트는 /api/market-scope가 Supabase를 읽어 실시간으로 보여줍니다.
#
# scripts/collect_market_scope.py를 인자 없이("오늘" 기준) 실행하면 내부적으로
# scripts/krx_calendar.py(is_trading_day)로 오늘이 KRX 개장일인지 확인해,
# 개장일이 아니면 리포트를 만들지 않고 조용히 종료합니다.
#
# 필요한 GitHub Secrets (이 저장소의 Settings → Secrets and variables → Actions):
#   - GEMINI_API_KEY             : Google Gemini API 키 (사람이 직접 등록해야 함)
#   - SUPABASE_URL                : 사이트가 쓰는 것과 동일한 Supabase 프로젝트 URL
#   - SUPABASE_SERVICE_ROLE_KEY   : RLS를 우회해 쓰기 위한 서버 전용 키 (사이트 저장소 .env.local과 동일 값)
#
# (더 이상 필요하지 않음: SITE_REPO_PAT — 사이트 저장소에 커밋할 필요가 없어져서 제거했습니다.)

on:
  schedule:
    # 매일 20:00 UTC = 05:00 KST(다음날). 개장일이 아니면 스크립트 내부에서
    # 자동으로 스킵되므로 요일 조건 없이 매일 호출한다.
    - cron: "0 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: market-scope-daily
  cancel-in-progress: false

jobs:
  collect-market-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 이 저장소(리서치자동화) 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install requests beautifulsoup4 google-generativeai

      - name: 마켓 스코프 수집 (개장일에만 실제 리포트 생성) → Supabase 저장
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/collect_market_scope.py
